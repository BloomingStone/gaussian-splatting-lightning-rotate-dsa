# 在原有3D形变场的基础上增加density 变化，命名用 with_flow 来区分原来的3D形变场模型
max_steps: 10000
save_val: true
cache_all_images: true
trainer:
  check_val_every_n_epoch: 5
  precision: 16-mixed

save_iterations: [1000, 5000, 10000]

data:
  val_max: null
  image_on_cpu: false
  parser:
    class_path: internal.dataparsers.xray_dataparser.parser.XRayDataParser
    init_args:
      meta_loader:
        class_path: internal.dataparsers.xray_dataparser.meta.XRayMetaLoader
      cloud_parser:
        class_path: internal.dataparsers.xray_dataparser.cloud_parsers.RandomCloudParser
        init_args:
          num_points: 100_000
      spliter:
        class_path: internal.dataparsers.xray_dataparser.splitters.RenderNewViewsSpliter
        init_args:
          train_ratio: 0.8
      cameras_builder:
        class_path: internal.dataparsers.xray_dataparser.cameras_builder.RotateXRayCamerasBuilder
      dataset_builder:
        class_path: internal.dataparsers.xray_dataparser.datasets.TiffDatasetBuilder
        init_args:
          base_name: rotate_dsa
          dataset_config:
            class_path: internal.dataparsers.xray_dataparser.datasets.TiffDatasetConfig

model:
  max_save_val_output: 10
  renderer:
    class_path: internal.renderers.deformabel_xray_renderer_with_flow.DeformableXrayRendererWithFlow
    init_args:
      optimization_config:
        enable_ast: true
        log_gradients: true
        grad_log_interval: 50
      deform_model_config:
        class_path: internal.deform_models.deform_with_flow.HashGridDeformConfig
        init_args:
          phase_multires: 6
          x_multires: 13
          log2_hashmap_size: 19
          max_resolution: 2048
  metric:
    class_path: internal.metrics.rotate_xray_metrics_with_flow.RotateXrayMetrics
    init_args:
      fused_ssim: true
      w_gray_loss: 1.0
      w_ssim_loss: 1.0
      w_d_density: 10.0
  gaussian:
    class_path: internal.models.xray_coronary_gaussian_with_flow.XrayCoronaryGaussianWithFlow
    init_args:
      optimization:
        log_gradients: true
        grad_log_interval: 50
  density:
    class_path: internal.density_controllers.rotate_xray_density_controller.RotateXrayDensityController
  renderer_output_types: 
    - gray_image
    - gray_coronary
  saver:
    class_path: internal.savers.x_ray_saver_with_flow.XRaySaver
    init_args:
      save_ckpt: false
      save_vtp: false
      save_nii: true
      save_phase: 0.
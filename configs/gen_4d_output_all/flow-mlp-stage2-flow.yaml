# 阶段二（flow）：造影剂流动 d_density(t) 重建。
#
# 与 flow-mlp-stage2.yaml 的差异：
#   1. deform_model_config 对齐 stage1 最优 (max_resolution=128, max_rotation=0.3,
#      phase_periodic=true, phase_multires=4)，保证 initialize_from 能加载 stage1 ckpt。
#   2. 开启 use_grid_val，在 grid 多视角集上算 2D 指标 (PSNR/SSIM)。
#   3. 新增 d_density 时空平滑：flow_temporal_smooth (deform 时间探针) +
#      w_flow_spatial_smooth / w_flow_temporal_smooth (metric 权重)。
#
# 运行方式（stage1 输出目录名做 initialize_from）：
#   pixi run gs-fit --config configs/gen_4d_output_all/flow-mlp-stage2-flow.yaml \
#     --data.path data/example_grids \
#     --model.initialize_from outputs/dev_grid_views/hashgrid-adaptive-smooth/<stage1_name> \
#     -n <stage2_name>
# 改动1（全帧 stage2）：CLI 覆盖 --data.parser.init_args.spliter.init_args.end_frame 180
project: RotCA-GR

max_steps: 10000


trainer:
  log_every_n_steps: 500
  check_val_every_n_epoch: 50
  precision: 16-mixed
  callbacks:
    - class_path: internal.callbacks.callbacks.ValidateOnTrainEnd
    - class_path: internal.callbacks.callbacks.ProgressBar
      init_args:
        refresh_rate: 50

    - class_path: internal.callbacks.scene_saver.SceneSaver
      init_args:
        save_iterations: [10000]
        saver:
          class_path: internal.savers.x_ray_saver_with_flow.XRaySaver_Flow
          init_args:
            save_ckpt: true
            save_vtp: true
            save_volume: false
            save_label_threshold: 0.0344
            save_time_or_type: 0.5
            save_phase: 0.

    - class_path: internal.callbacks.save_image.SaveImage
      init_args:
        save_val_output: true
        max_save_val_output: 20
        max_image_saving_threads: 3


data:
  parser:
    class_path: internal.dataparsers.xray_dataparser.parser.XRayDataParserBuilder
    init_args:
      use_grid_val: true
      grid_val_loader:
        class_path: internal.dataparsers.xray_dataparser.grid_val.GridValLoader
        init_args:
          phase_stride: 20
      meta_loader:
        class_path: internal.dataparsers.xray_dataparser.meta.XRayMetaLoader
      cloud_parser:
        class_path: internal.dataparsers.xray_dataparser.cloud_parsers.RandomCloudParser
        init_args:
          num_points: 10_000
      spliter:
        class_path: internal.dataparsers.xray_dataparser.splitters.FrameRangeSpliter
        init_args:
          start_frame: 0
          end_frame: 40
          val_ratio: 0.2
      cameras_builder:
        class_path: internal.dataparsers.xray_dataparser.cameras_builder.RotateXRayCamerasBuilder
      dataset_builder:
        class_path: internal.dataparsers.xray_dataparser.datasets.ImagesDatasetBuilder
        init_args:
          dataset_config:
            image_uint8: false

model:
  # 指向阶段一的输出目录（或直接给 checkpoint 路径）；命令行覆盖见文件头部注释
  initialize_from: null
  renderer:
    class_path: internal.renderers.deformabel_xray_renderer_with_flow.DeformableXrayRendererWithFlow
    init_args:
      optimization_config:
        enable_ast: true
        density_ramp_steps: 2000
      deform_model_config:
        class_path: internal.deform_models.deform_with_flow.HashGridDeformConfig
        init_args:
          t_phase_combined: false
          phase_multires: 4
          x_multires: 13
          log2_hashmap_size: 19
          max_resolution: 128
          max_rotation: 0.3
          phase_periodic: true
          enable_flow: true
          freeze_motion: true
          d_scaling_min: -0.5
          flow_temporal_smooth: false
          flow_temporal_eps: 0.05
  metric:
    class_path: internal.metrics.rotate_xray_metrics_with_flow.RotateXrayMetrics
    init_args:
      fused_ssim: true
      w_gray_loss: 1.0
      w_ssim_loss: 1.0
      w_d_density: 0.0
      w_flow_gate: 1.0
      flow_gate_quantile: 0.5
      flow_gate_sharpness: 10.0
      w_flow_spatial_smooth: 0.0
      flow_smooth_k: 4
      flow_smooth_sample: 1024
      w_flow_temporal_smooth: 0.0
  gaussian:
    class_path: internal.models.xray_coronary_gaussian_with_flow.XrayCoronaryGaussianWithFlow
    init_args:
      freeze_gaussians: true
  density:
    class_path: internal.density_controllers.rotate_xray_density_controller.RotateXrayDensityController
    init_args:
      enable_densification: false
      densification_interval: 300
      densify_grad_percentile: 0.98
      cull_density_threshold: 5e-5

# 实验 hashgrid-adaptive-smooth：hashgrid 形变场 + 空间自适应平滑正则。
# 洞察：体积大部分静止、运动只在局部。均匀平滑会过度平滑运动血管、又在静止背景
# 浪费容量。因此惩罚 ||du/dx||^2 并按 (1 - 归一化密度) 空间加权：低密度(静止背景)
# 强约束为平滑/刚性，高密度(血管)保留精细形变自由度。
#
# 与 stage1-spike 唯一差异：
#   * deform_model_config.enable_field_smooth: true
#   * metric.w_field_smooth: <权重>（运行时 CLI 覆盖扫描）
project: RotCA-GR

max_steps: 20000

trainer:
  log_every_n_steps: 500
  check_val_every_n_epoch: 20
  precision: 16-mixed
  callbacks:
    - class_path: internal.callbacks.callbacks.ValidateOnTrainEnd
    - class_path: internal.callbacks.callbacks.ProgressBar
      init_args:
        refresh_rate: 50

    - class_path: internal.callbacks.scene_saver.SceneSaver
      init_args:
        save_iterations: [20000]
        saver:
          class_path: internal.savers.x_ray_saver_with_flow.XRaySaver_Flow
          init_args:
            save_ckpt: true
            save_vtp: true
            save_volume: false
            save_label_threshold: 0.0344
            save_time_or_type: 0.5
            save_phase: 0.

    - class_path: internal.callbacks.save_image.SaveImage
      init_args:
        save_val_output: true
        max_save_val_output: 20
        max_image_saving_threads: 3

data:
  parser:
    class_path: internal.dataparsers.xray_dataparser.parser.XRayDataParserBuilder
    init_args:
      use_grid_val: true
      grid_val_loader:
        class_path: internal.dataparsers.xray_dataparser.grid_val.GridValLoader
        init_args:
          phase_stride: 20
      grid_dataset_config:
        class_path: internal.dataparsers.xray_dataparser.datasets.ImagesDatasetConfig
        init_args:
          image_uint8: false
          weight_source: none
      meta_loader:
        class_path: internal.dataparsers.xray_dataparser.meta.XRayMetaLoader
      cloud_parser:
        class_path: internal.dataparsers.xray_dataparser.cloud_parsers.RandomCloudParser
        init_args:
          num_points: 10_000
      spliter:
        class_path: internal.dataparsers.xray_dataparser.splitters.FrameRangeSpliter
        init_args:
          start_frame: 40
          end_frame: null
          val_start_frame: 0
          val_end_frame: 40
          val_ratio: 0.2
      cameras_builder:
        class_path: internal.dataparsers.xray_dataparser.cameras_builder.RotateXRayCamerasBuilder
      dataset_builder:
        class_path: internal.dataparsers.xray_dataparser.datasets.ImagesDatasetBuilder
        init_args:
          dataset_config:
            image_uint8: false

model:
  renderer:
    class_path: internal.renderers.deformabel_xray_renderer_with_flow.DeformableXrayRendererWithFlow
    init_args:
      optimization_config:
        enable_ast: true
        density_ramp_steps: 2000
      deform_model_config:
        class_path: internal.deform_models.deform_with_flow.HashGridDeformConfig
        init_args:
          t_phase_combined: false
          phase_multires: 6
          x_multires: 13
          log2_hashmap_size: 19
          max_resolution: 2048
          enable_flow: false
          d_scaling_min: -0.5
          enable_field_smooth: true
          smooth_eps: 0.01
  metric:
    class_path: internal.metrics.rotate_xray_metrics_with_flow.RotateXrayMetrics
    init_args:
      fused_ssim: true
      w_gray_loss: 1.0
      w_ssim_loss: 1.0
      w_d_density: 0.0
      w_flow_gate: 0.0
      w_field_smooth: 1.0     # 运行时 CLI 覆盖扫描
      compute_3d_metrics: false
  gaussian:
    class_path: internal.models.xray_coronary_gaussian_with_flow.XrayCoronaryGaussianWithFlow
  density:
    class_path: internal.density_controllers.rotate_xray_density_controller.RotateXrayDensityController
    init_args:
      densification_interval: 300
      densify_grad_percentile: 0.98
      cull_density_threshold: 5e-5

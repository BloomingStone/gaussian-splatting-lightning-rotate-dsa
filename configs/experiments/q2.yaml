defaults:
  - base
  - _self_

study_name: Q2

train:
  dry_run: false

# Q2 默认写入一个“最佳模型占位”，运行前按Q1结果替换。
# 可直接在命令行覆盖这些字段。
sweeps:
  - name: q2_sparse_shuffle
    mode: single-variable
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 1024
      data.parser.init_args.random_loader_mode: random-shuffle
    grid:
      data.parser.init_args.train_ratio: [0.8, 0.6, 0.5, 0.4, 0.2]

  - name: q2_sparse_start
    mode: single-variable
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 1024
      data.parser.init_args.random_loader_mode: random-start
    grid:
      data.parser.init_args.train_ratio: [0.8, 0.6, 0.5, 0.4, 0.2]

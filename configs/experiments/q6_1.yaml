defaults:
  - base
  - _self_

study_name: Q6_1

train:
  dry_run: false
  base_config: configs/rotate_xray_3dgr/rotate_xray_3dgr_coronary_props.yaml
  # gpus: ["0", "1"]

# Q6: 参考 Q3 的写法，专门做不同 loss weight 的 single-variable 扫描。
sweeps:
  - name: q3_A_base
    mode: grid
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid: {}
  
  - name: q6_motion_var_loss
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_motion_var_loss: [0.001, 0.005, 0.01, 0.02, 0.05]

  - name: q6_motion_mean_loss
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_motion_mean_loss: [0.001, 0.005, 0.01, 0.02, 0.05]

  - name: q6_coronary_props
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_coronary_props: [0.001, 0.005, 0.01, 0.02, 0.05]

  - name: q6_coronary_props_entropy
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_coronary_props_entropy: [0.001, 0.005, 0.01, 0.02, 0.05]

  - name: q6_motion_corr_loss
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_motion_corr_loss: [0.001, 0.005, 0.01, 0.02, 0.05]

  - name: q6_density_corr_loss
    mode: single-variable
    fixed:
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.75
    grid:
      model.metric.init_args.w_density_corr_loss: [0.001, 0.005, 0.01, 0.02, 0.05]

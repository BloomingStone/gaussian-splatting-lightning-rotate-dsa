defaults:
  - base
  - _self_

study_name: Q3

train:
  dry_run: false

sweeps:
  - name: q3_A_base
    mode: grid
    fixed:
      # 最佳模型占位，建议按Q1结果覆盖
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 512
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
    grid: {}

  - name: q3_B_tv
    mode: grid
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 512
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
      model.metric.init_args.enable_deform_tv_loss: true
    grid:
      model.metric.init_args.w_deform_tv_loss: [0.01, 0.1, 1.0]

  - name: q3_C_frangi
    mode: grid
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 512
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
      model.metric.init_args.enable_frangi_loss: true
    grid:
      model.metric.init_args.w_frangi_loss: [0.01, 0.1, 1.0]

  - name: q3_D_tv_frangi
    mode: grid
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 512
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
      model.metric.init_args.enable_deform_tv_loss: true
      model.metric.init_args.enable_frangi_loss: true
    grid:
      model.metric.init_args.w_deform_tv_loss: [0.01, 0.1, 1.0]
      model.metric.init_args.w_frangi_loss: [0.01, 0.1, 1.0]

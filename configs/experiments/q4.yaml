defaults:
  - base
  - _self_

study_name: Q4

train:
  dry_run: false

sweeps:
  - name: q1_hashgrid
    mode: single-variable
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.HashGridDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.max_resolution: 512
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
    grid:
      model.renderer.init_args.deform_model_config.init_args.t_multires: [4, 6, 8, 10]
      model.renderer.init_args.deform_model_config.init_args.x_multires: [4, 6, 8, 10]
      model.renderer.init_args.deform_model_config.init_args.max_resolution: [64, 256, 512, 1024]

  - name: q1_mlp
    mode: single-variable
    fixed:
      model.renderer.init_args.deform_model_config.class_path: internal.deform_models.MLPDeformConfig
      model.renderer.init_args.deform_model_config.init_args.t_multires: 6
      model.renderer.init_args.deform_model_config.init_args.x_multires: 8
      model.renderer.init_args.deform_model_config.init_args.D: 8
      data.parser.init_args.random_loader_mode: random-start
      data.parser.init_args.train_ratio: 0.5
    grid:
      model.renderer.init_args.deform_model_config.init_args.t_multires: [4, 6, 8, 10]
      model.renderer.init_args.deform_model_config.init_args.x_multires: [4, 6, 8, 10]
      model.renderer.init_args.deform_model_config.init_args.D: [6, 8, 10, 12]
